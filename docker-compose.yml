services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chailm-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - QDRANT_URL=http://qdrant:6333
      - INNGEST_BASE_URL=http://inngest:8288
      - NODE_ENV=development
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./src:/usr/src/api/src
      - ./server.js:/usr/src/api/server.js
      - /usr/src/api/node_modules
    networks:
      - chailm-network

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: chailm-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" 
      - "6334:6334" 
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - chailm-network

  inngest:
    image: inngest/inngest:latest
    container_name: chailm-inngest
    restart: unless-stopped
    ports:
      - "8288:8288" 
    command: [ "inngest", "dev", "-u", "http://api:5000/api/inngest", "--no-discovery" ]
    depends_on:
      - api
    networks:
      - chailm-network

volumes:
  qdrant_storage:
    driver: local

networks:
  chailm-network:
    driver: bridge
