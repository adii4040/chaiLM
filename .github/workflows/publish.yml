name: Publish

on:
  push:
    branches: [dev, main]

jobs:
  docker_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag based on branch
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TAG=latest" >> $GITHUB_ENV
          else
            echo "TAG=dev" >> $GITHUB_ENV
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/adii4040/chailm-api:${{ env.TAG }}
            ghcr.io/adii4040/chailm-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy_cloud_run:
    needs: docker_publish
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: chailm-507011
          workload_identity_provider: projects/756784338813/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-deployer@chailm-507011.iam.gserviceaccount.com

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: chailm-api
          region: asia-south1
          project_id: chailm-507011
          image: ghcr.io/adii4040/chailm-api:${{ github.sha }}
